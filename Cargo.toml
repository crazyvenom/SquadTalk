[package]
name = "squadtalk"
version = "0.4.0"
edition = "2021"
description = "Lightweight self-hosted voice chat for gaming"

[lib]
name = "squadtalk"
path = "src/lib.rs"

# The Windows app (needs the "gui" feature).
[[bin]]
name = "squadtalk"
path = "src/main.rs"
required-features = ["gui"]

# The standalone server for a 24/7 Linux machine (e.g. Oracle Cloud).
[[bin]]
name = "squadtalk-server"
path = "src/bin/squadtalk-server.rs"

[features]
default = ["gui"]
gui = ["dep:cpal", "dep:opus", "dep:windows-sys"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = { version = "0.15.3", optional = true }
opus = { version = "0.3.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", optional = true, features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_UI_Shell",
    "Win32_System_LibraryLoader",
] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
