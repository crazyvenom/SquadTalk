[package]
name = "squadtalk"
version = "0.1.0"
edition = "2021"
description = "Lightweight self-hosted voice chat for gaming"

[dependencies]
cpal = "0.15.3"
opus = "0.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Controls",
    "Win32_Graphics_Gdi",
    "Win32_System_LibraryLoader",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
